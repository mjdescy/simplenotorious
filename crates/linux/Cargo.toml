[package]
name = "simplenotorious-linux"
version = "0.1.1"
edition = "2024"
license = "MIT"

[[bin]]
name = "simplenotorious"
path = "src/main.rs"

[dependencies]
simplenotorious-core = { path = "../core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
webkit6 = "0.6"
sourceview5 = "0.11"
async-channel = "2"
